name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeCheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Run automated test suite
        run: pnpm run test

      - name: Build Chromium MV3 extension
        run: pnpm run build

      - name: Verify build artifacts
        run: |
          test -d .output/chrome-mv3
          test -f .output/chrome-mv3/manifest.json
          test -f .output/chrome-mv3/sidepanel.html
          echo "Production extension bundle successfully verified."

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run browser compatibility harness
        run: pnpm run test:e2e
